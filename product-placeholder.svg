    <circle cx="160" cy="410" r="3"/>
    <circle cx="180" cy="420" r="2"/>
    <circle cx="205" cy="415" r="2.5"/>
    <circle cx="300" cy="418" r="2"/>
    <circle cx="320" cy="408" r="3"/>
    <circle cx="270" cy="425" r="2"/>
